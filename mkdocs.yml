site_name: Documentacion de Tramites
docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - yaml
    - csharp
  locale: es

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Inicio: index.md
  - Tramites:
      - Emision Hogar Comprensivo: tramites/emision-hogar-comprensivo.md
      - Emision Voluntario Automoviles: tramites/emision-voluntario-aotomoviles.md
  - Workflows:
      - CAD Revision Digitacion y Finiquito: workflows/wf-cad-revision-digitacion-finiquito.md
  - Catalogos:
      - Documentos: catalogos/catalogos-documentos.md